# Lint + typecheck + build on every PR. Kept separate from static.yml on purpose:
# the Pages deploy job there runs only on push to main, and must never run from a PR.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          BASE_PATH: /resume/
          SITE_URL: https://thequietlooppm.github.io/resume/
        run: npm run build
